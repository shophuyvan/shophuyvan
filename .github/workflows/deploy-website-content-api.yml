name: Deploy Website Content API

on:
  push:
    branches: [ main ]
    paths:
      - "workers/website-content-api/**"
      - ".github/workflows/deploy-website-content-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-content-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/website-content-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy
